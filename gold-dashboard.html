<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Price Dashboard</title>

  <!-- Chart.js draws the chart for us. It loads from the internet (a "CDN"). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #f4f1ea; --card: #ffffff; --text: #23201a; --muted: #766f60;
      --line: #e3ddcf; --gold: #b8860b; --gold-soft: rgba(184,134,11,0.14);
      --accent-text: #ffffff; --up: #1f7a45; --down: #b3372b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17150f; --card: #211e16; --text: #f1ecdf; --muted: #a39b87;
        --line: #363225; --gold: #e0b43a; --gold-soft: rgba(224,180,58,0.16);
        --accent-text: #17150f; --up: #5cc487; --down: #ee7d70;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 40px 16px; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: system-ui, sans-serif; display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 820px; }
    h1 { font-family: Georgia, serif; font-size: 2.1rem; margin: 0; }
    .sub { color: var(--muted); margin: 4px 0 16px; }
    a { color: var(--gold); }

    .notice {
      background: var(--gold-soft); border-left: 4px solid var(--gold);
      padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; margin: 0 0 16px;
    }

    .key-panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 14px; margin-bottom: 24px; font-size: 0.9rem;
    }
    .key-panel summary { cursor: pointer; font-weight: 600; }
    .key-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .key-row input {
      flex: 1 1 220px; padding: 10px 12px; font-size: 1rem;
      color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px;
    }
    .key-row button {
      padding: 10px 16px; font-size: 0.95rem; cursor: pointer; border-radius: 8px;
      background: var(--gold); color: var(--accent-text); border: 1px solid var(--gold); font-weight: 600;
    }
    .key-row button.secondary { background: var(--card); color: var(--text); border-color: var(--line); font-weight: 400; }
    .small { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }

    .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .price { font-family: Georgia, serif; font-size: 2.6rem; line-height: 1.1; min-height: 2.9rem; }
    .change { font-size: 1rem; margin-top: 4px; font-weight: 600; min-height: 1.4rem; }
    .change.up { color: var(--up); }
    .change.down { color: var(--down); }

    .ranges { display: flex; gap: 6px; }
    .ranges button {
      padding: 8px 16px; font-size: 0.95rem; cursor: pointer;
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); border-radius: 999px;
    }
    .ranges button[aria-pressed="true"] {
      background: var(--gold); color: var(--accent-text); border-color: var(--gold); font-weight: 600;
    }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .chart-wrap {
      position: relative; height: 360px; margin: 20px 0 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    }
    #error { color: var(--down); margin: 8px 0; min-height: 1.2rem; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
    .stat .label { color: var(--muted); font-size: 0.85rem; }
    .stat .value { font-size: 1.25rem; font-weight: 600; margin-top: 4px; }
  </style>
</head>

<body>
  <main>
    <h1>Gold price</h1>
    <p class="sub">XAU/USD, US dollars per troy ounce</p>

    <p class="notice" id="notice" role="note"></p>

    <details class="key-panel" id="key-panel">
      <summary>Live data settings</summary>
      <p>Paste your free <a href="https://twelvedata.com" target="_blank" rel="noopener">Twelve Data</a>
         API key. It is saved only in this browser, never in this file.</p>
      <div class="key-row">
        <input type="password" id="key-input" placeholder="Your API key" aria-label="Twelve Data API key" autocomplete="off">
        <button id="key-save">Save key</button>
        <button id="key-remove" class="secondary">Remove key</button>
      </div>
      <p class="small" id="key-status"></p>
    </details>

    <section class="top">
      <div>
        <div id="price" class="price"></div>
        <div id="change" class="change"></div>
      </div>
      <div class="ranges" role="group" aria-label="Time range">
        <button data-range="day" aria-pressed="false">Day</button>
        <button data-range="week" aria-pressed="false">Week</button>
        <button data-range="month" aria-pressed="true">Month</button>
        <button data-range="year" aria-pressed="false">Year</button>
      </div>
    </section>

    <div class="chart-wrap">
      <canvas id="chart" role="img" aria-label="Line chart of the gold price over the selected time range"></canvas>
    </div>
    <p id="error" role="alert"></p>
    <p class="small" id="source"></p>

    <section class="stats">
      <div class="stat"><div class="label">Start of range</div><div class="value" id="stat-start"></div></div>
      <div class="stat"><div class="label">High</div><div class="value" id="stat-high"></div></div>
      <div class="stat"><div class="label">Low</div><div class="value" id="stat-low"></div></div>
    </section>
  </main>

  <script>
    // ===== 1. Settings for each time range =====
    // interval = size of each data point, count = how many points to ask for.
    // Markets close at weekends, so "Day" and "Week" mean the latest trading
    // bars (about 24 hours and about 5 trading days), not exact calendar time.
    const RANGES = {
      day:   { interval: "15min", count: 96,  ms: 900000 },
      week:  { interval: "1h",    count: 120, ms: 3600000 },
      month: { interval: "4h",    count: 132, ms: 14400000 },
      year:  { interval: "1day",  count: 260, ms: 86400000 }
    };

    // ===== 2. Remember the API key in this browser only =====
    const KEY_NAME = "twelvedata_key";
    function loadKey() {
      try { return localStorage.getItem(KEY_NAME) || ""; } catch (e) { return ""; }
    }
    function storeKey(value) {
      try {
        if (value) localStorage.setItem(KEY_NAME, value);
        else localStorage.removeItem(KEY_NAME);
      } catch (e) { console.log("Could not save key:", e); }
    }
    let apiKey = loadKey();

    // ===== 3. LIVE DATA from Twelve Data =====
    const cache = {}; // remember answers for 5 minutes to save your daily request limit

    // Twelve Data gives times like "2026-11-14 10:00:00" (UTC) or "2026-11-14"
    function parseTime(text) {
      const iso = text.length > 10 ? text.replace(" ", "T") + "Z" : text + "T00:00:00Z";
      return new Date(iso);
    }

    async function fetchLive(range) {
      const hit = cache[range];
      if (hit && Date.now() - hit.at < 5 * 60 * 1000) return hit.points;

      const { interval, count } = RANGES[range];
      const url = "https://api.twelvedata.com/time_series?" + new URLSearchParams({
        symbol: "XAU/USD",
        interval: interval,
        outputsize: count,
        timezone: "UTC",
        apikey: apiKey
      });

      const response = await fetch(url);
      const json = await response.json();

      // Errors (bad key, rate limit...) come back as JSON with status "error"
      if (json.status === "error" || !Array.isArray(json.values)) {
        throw new Error(json.message || "Unexpected response from Twelve Data.");
      }

      // The newest point comes first, so reverse to get oldest to newest
      const points = json.values
        .map(v => ({ time: parseTime(v.datetime), price: Number(v.close) }))
        .reverse();

      cache[range] = { at: Date.now(), points: points };
      return points;
    }

    // ===== 4. DEMO DATA (used when no key is saved) =====
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function demoPrices(range) {
      const { count, ms } = RANGES[range];
      const rand = mulberry32(count * 31 + 7);
      const size = 0.0025 * Math.sqrt(ms / 3600000); // bigger steps for longer bars
      const walk = [];
      let x = 0;
      for (let i = 0; i < count; i++) {
        x += (rand() + rand() + rand() - 1.5) * size;
        walk.push(x);
      }
      const last = walk[count - 1], now = Date.now();
      return walk.map((value, i) => ({
        time: new Date(now - (count - 1 - i) * ms),
        price: 4150 * Math.exp(value - last)
      }));
    }

    // ===== 5. Formatting helpers =====
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

    function shortLabel(date, range) {
      if (range === "day") return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (range === "week") return date.toLocaleDateString([], { weekday: "short", day: "numeric" });
      const opts = { day: "numeric", month: "short" };
      if (range === "year") opts.timeZone = "UTC"; // daily bars are dated in UTC
      return date.toLocaleDateString([], opts);
    }

    function fullLabel(date, range) {
      if (range === "year") return date.toLocaleDateString([], { dateStyle: "medium", timeZone: "UTC" });
      return date.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    }

    function css(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // ===== 6. Headline numbers =====
    function updateStats(data) {
      const prices = data.map(p => p.price);
      const first = prices[0];
      const latest = prices[prices.length - 1];
      const change = latest - first;
      const percent = (change / first) * 100;
      const sign = change >= 0 ? "+" : "-";

      document.getElementById("price").textContent = money.format(latest);

      const changeEl = document.getElementById("change");
      changeEl.textContent = sign + money.format(Math.abs(change)) +
        " (" + sign + Math.abs(percent).toFixed(2) + "%) over this range";
      changeEl.className = "change " + (change >= 0 ? "up" : "down");

      document.getElementById("stat-start").textContent = money.format(first);
      document.getElementById("stat-high").textContent = money.format(Math.max(...prices));
      document.getElementById("stat-low").textContent = money.format(Math.min(...prices));
    }

    // ===== 7. The chart =====
    let chart = null;
    let current = "month";
    let currentData = [];

    function drawChart(data, range) {
      const labels = data.map(p => shortLabel(p.time, range));
      const titles = data.map(p => fullLabel(p.time, range));
      const prices = data.map(p => p.price);

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            data: prices,
            borderColor: css("--gold"),
            backgroundColor: css("--gold-soft"),
            borderWidth: 2, fill: true, tension: 0.2,
            pointRadius: 0, pointHoverRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: items => titles[items[0].dataIndex],
                label: item => money.format(item.parsed.y)
              }
            }
          },
          scales: {
            x: { ticks: { color: css("--muted"), maxTicksLimit: 6, maxRotation: 0 }, grid: { display: false } },
            y: { ticks: { color: css("--muted"), callback: v => "$" + v.toLocaleString() }, grid: { color: css("--line") } }
          }
        }
      });
    }

    // ===== 8. Show a range: get data, then update numbers and chart =====
    function setSource(isDemo, lastTime) {
      const notice = document.getElementById("notice");
      notice.style.display = isDemo ? "block" : "none";
      notice.innerHTML = "<strong>Demo data.</strong> These prices are simulated and not real. " +
        "Open <em>Live data settings</em> below and add your Twelve Data key to see real prices.";
      document.getElementById("source").textContent = isDemo
        ? "Source: simulated demo data."
        : "Source: Twelve Data, XAU/USD. Latest data point: " + lastTime.toLocaleString() +
          ". Prices may be delayed. Not financial advice.";
    }

    function friendlyError(error) {
      if (error instanceof TypeError) {
        return "Could not reach Twelve Data. Check your internet connection and try again.";
      }
      return "Twelve Data said: " + error.message;
    }

    async function showRange(range) {
      current = range;
      document.querySelectorAll(".ranges button").forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.range === range ? "true" : "false");
      });
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      try {
        if (apiKey) {
          currentData = await fetchLive(range);
          setSource(false, currentData[currentData.length - 1].time);
        } else {
          currentData = demoPrices(range);
          setSource(true);
        }
        updateStats(currentData);
        drawChart(currentData, range);
      } catch (error) {
        errorEl.textContent = friendlyError(error);
        console.log(error);
      }
    }

    // ===== 9. Buttons and key settings =====
    const keyPanel = document.getElementById("key-panel");
    const keyInput = document.getElementById("key-input");
    const keyStatus = document.getElementById("key-status");

    function updateKeyStatus() {
      keyStatus.textContent = apiKey ? "A key is saved in this browser." : "No key saved yet.";
      keyPanel.open = !apiKey; // open the panel automatically until a key is saved
    }

    document.querySelectorAll(".ranges button").forEach(btn => {
      btn.addEventListener("click", () => showRange(btn.dataset.range));
    });

    document.getElementById("key-save").addEventListener("click", () => {
      const value = keyInput.value.trim();
      if (!value) return;
      apiKey = value;
      storeKey(apiKey);
      keyInput.value = "";
      Object.keys(cache).forEach(k => delete cache[k]);
      updateKeyStatus();
      showRange(current);
    });

    document.getElementById("key-remove").addEventListener("click", () => {
      apiKey = "";
      storeKey("");
      Object.keys(cache).forEach(k => delete cache[k]);
      updateKeyStatus();
      showRange(current);
    });

    // Redraw the chart if the computer switches between light and dark mode
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (currentData.length) drawChart(currentData, current);
    });

    updateKeyStatus();
    showRange("month");
  </script>
</body>
</html>
