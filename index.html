<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>

  <!-- ============ CSS: how the page looks ============ -->
  <style>
    /* Colors live in variables so they're easy to change in one place */
    :root {
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #1b2a3a;
      --muted: #6b7a8a;
      --line: #d9e1e9;
      --accent: #2f5d8a;
      --accent-text: #ffffff;
      --done: #9aa8b6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131b24; --card: #1c2733; --text: #e8eef4; --muted: #8fa0b1;
        --line: #2c3a49; --accent: #6fa3d6; --accent-text: #0f1720; --done: #5d6e7f;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0 0 4px;
    }

    #summary {
      margin: 0 0 24px;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }

    /* The row with the text box and the Add button */
    .add-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

    input[type="text"], input[type="date"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: system-ui, sans-serif;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    button {
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      cursor: pointer;
    }

    .add-btn {
      padding: 12px 18px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 8px;
      font-weight: 600;
    }

    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    li:last-child { border-bottom: none; }

    li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }

    li span { flex: 1; overflow-wrap: anywhere; }

    /* Style for finished tasks: faded and crossed out */
    li.done span { color: var(--done); text-decoration: line-through; }

    .delete-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .delete-btn:hover { color: #c0392b; }

    /* Edit, Save and Cancel share one quiet button style */
    .edit-btn, .save-btn, .cancel-btn {
      background: none;
      border: none;
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .edit-btn:hover, .save-btn:hover, .cancel-btn:hover { text-decoration: underline; }

    /* The text box that appears while editing a task */
    li input.edit-input { padding: 8px 10px; min-width: 0; }

    /* Date pickers keep their natural width; the text box grows and wraps */
    input[type="date"] { flex: none; }
    .add-row input[type="text"] { flex: 1 1 200px; }
    li input[type="date"] { padding: 8px 10px; font-size: 0.9rem; }

    /* Task text with its due date underneath */
    .task-body { flex: 1; min-width: 0; }
    .due {
      display: block;
      margin-top: 2px;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .due.overdue { color: #c0392b; font-weight: 600; }
    .due.today { color: var(--accent); font-weight: 600; }

    /* Edit mode: text box and date picker stacked */
    .edit-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .edit-fields .edit-input { width: 100%; }

    /* Message shown when the list is empty */
    #empty {
      text-align: center;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      padding: 28px 0;
    }

    /* Filter buttons and sort toggle */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-family: system-ui, sans-serif;
    }
    .filters { display: flex; gap: 6px; }
    .filters button {
      padding: 6px 14px;
      font-size: 0.9rem;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .filters button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .sort {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }
    .sort input { width: 16px; height: 16px; accent-color: var(--accent); }
  </style>
</head>

<!-- ============ HTML: the structure of the page ============ -->
<body>
  <main>
    <h1>My to-do list</h1>
    <p id="summary"></p>

    <div class="add-row">
      <input type="text" id="task-input" placeholder="What needs doing?" aria-label="New task" autofocus>
      <input type="date" id="due-input" aria-label="Due date (optional)">
      <button class="add-btn" id="add-btn">Add task</button>
    </div>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="active" aria-pressed="false">Active</button>
        <button data-filter="done" aria-pressed="false">Done</button>
      </div>
      <label class="sort"><input type="checkbox" id="sort-toggle"> Sort by due date</label>
    </div>

    <ul id="task-list"></ul>
    <p id="empty">No tasks yet. Add your first one above.</p>
  </main>

  <!-- ============ JavaScript: how the page behaves ============ -->
  <script>
    // 1. Grab the elements we need to work with
    const input = document.getElementById("task-input");
    const dueInput = document.getElementById("due-input");
    const addBtn = document.getElementById("add-btn");
    const list = document.getElementById("task-list");
    const emptyMsg = document.getElementById("empty");
    const summary = document.getElementById("summary");
    const sortToggle = document.getElementById("sort-toggle");
    const filterButtons = document.querySelectorAll(".filters button");

    // 2. Our data: a list of task objects like
    //    { id: "k3j2x9", text: "Buy milk", due: "2026-11-20", done: false }
    let tasks = [];

    // Settings for what we show (not saved, they reset on refresh)
    let editingId = null;     // id of the task being edited, or null for none
    let filter = "all";       // "all", "active" or "done"
    let sortByDue = false;    // is the sort toggle on?

    // Every task gets a unique id. Unlike its position in the list, an id
    // never changes, even when we sort or filter.
    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // 3. Load saved tasks from the browser's memory (localStorage)
    try {
      const saved = localStorage.getItem("tasks");
      if (saved) tasks = JSON.parse(saved);
    } catch (error) {
      console.log("Could not load saved tasks:", error);
    }
    // Tasks saved before this update have no id, so give them one
    tasks.forEach(task => { if (!task.id) task.id = newId(); });

    // 4. Save the current tasks so they're still here after a refresh
    function save() {
      try {
        localStorage.setItem("tasks", JSON.stringify(tasks));
      } catch (error) {
        console.log("Could not save tasks:", error);
      }
    }

    // Today's date as "YYYY-MM-DD", so dates can be compared as text
    function todayString() {
      const d = new Date();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + month + "-" + day;
    }

    // Turn "2026-11-20" into a friendly label, and say if it's overdue or today
    function describeDue(due, done) {
      const [year, month, day] = due.split("-").map(Number);
      const pretty = new Date(year, month - 1, day).toLocaleDateString(undefined, {
        month: "short", day: "numeric", year: "numeric"
      });
      const today = todayString();

      if (due === today) return { label: "Due today", status: done ? "" : "today" };
      if (due < today) return { label: (done ? "Was due " : "Overdue: ") + pretty, status: done ? "" : "overdue" };
      return { label: "Due " + pretty, status: "" };
    }

    // Sorting rule: earliest due date first, tasks with no date go last.
    // A compare function returns a negative number if a comes first,
    // a positive number if b comes first, and 0 if they tie.
    function compareDue(a, b) {
      if (a.due && b.due) return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
      if (a.due) return -1;
      if (b.due) return 1;
      return 0;
    }

    // Work out which tasks to show: filter first, then sort.
    // We make a copy so the real `tasks` list keeps its original order.
    function getVisibleTasks() {
      let visible = tasks.filter(task => {
        if (filter === "active") return !task.done;
        if (filter === "done") return task.done;
        return true;
      });
      if (sortByDue) visible = visible.sort(compareDue);
      return visible;
    }

    // 5. Draw the tasks on the page. We call this every time something changes.
    function render() {
      list.innerHTML = ""; // clear the old list

      getVisibleTasks().forEach(task => {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        // Checkbox: ticks a task done or not done
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Mark done: " + task.text);
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          editingId = null;
          save();
          render();
        });

        // The task text (textContent keeps typed text safe from code injection)
        const text = document.createElement("span");
        text.textContent = task.text;

        // Wrap the text and (if there is one) the due date together
        const body = document.createElement("div");
        body.className = "task-body";
        body.appendChild(text);
        if (task.due) {
          const info = describeDue(task.due, task.done);
          const dueEl = document.createElement("span");
          dueEl.className = "due " + info.status;
          dueEl.textContent = info.label;
          body.appendChild(dueEl);
        }

        // Delete button: keep every task except this one
        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "Delete";
        del.setAttribute("aria-label", "Delete: " + task.text);
        del.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          editingId = null;
          save();
          render();
        });

        if (task.id === editingId) {
          // EDIT MODE: text box, date picker, Save and Cancel
          const editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.value = task.text;
          editInput.setAttribute("aria-label", "Edit task");

          const editDate = document.createElement("input");
          editDate.type = "date";
          editDate.value = task.due || "";
          editDate.setAttribute("aria-label", "Edit due date");

          const saveEdit = () => {
            const newText = editInput.value.trim();
            if (newText !== "") task.text = newText;
            task.due = editDate.value; // empty string means no due date
            editingId = null;
            save();
            render();
          };
          const cancelEdit = () => {
            editingId = null;
            render();
          };

          const onKey = (event) => {
            if (event.key === "Enter") saveEdit();
            if (event.key === "Escape") cancelEdit();
          };
          editInput.addEventListener("keydown", onKey);
          editDate.addEventListener("keydown", onKey);

          const saveBtn = document.createElement("button");
          saveBtn.className = "save-btn";
          saveBtn.textContent = "Save";
          saveBtn.addEventListener("click", saveEdit);

          const cancelBtn = document.createElement("button");
          cancelBtn.className = "cancel-btn";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", cancelEdit);

          const fields = document.createElement("div");
          fields.className = "edit-fields";
          fields.append(editInput, editDate);

          li.append(checkbox, fields, saveBtn, cancelBtn);
          list.appendChild(li);
          editInput.focus();
        } else {
          // NORMAL MODE: text with Edit and Delete buttons
          const editBtn = document.createElement("button");
          editBtn.className = "edit-btn";
          editBtn.textContent = "Edit";
          editBtn.setAttribute("aria-label", "Edit: " + task.text);
          editBtn.addEventListener("click", () => {
            editingId = task.id;
            render();
          });

          li.append(checkbox, body, editBtn, del);
          list.appendChild(li);
        }
      });

      // Light up the button for the current filter
      filterButtons.forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.filter === filter ? "true" : "false");
      });

      // Empty message: different text depending on why the list is empty
      const showing = list.children.length;
      if (tasks.length === 0) emptyMsg.textContent = "No tasks yet. Add your first one above.";
      else emptyMsg.textContent = "No tasks match this filter.";
      emptyMsg.style.display = showing === 0 ? "block" : "none";
      list.style.display = showing === 0 ? "none" : "block";

      // The summary always counts ALL tasks, whatever the filter
      const doneCount = tasks.filter(t => t.done).length;
      summary.textContent = tasks.length === 0
        ? "Nothing to do yet."
        : doneCount + " of " + tasks.length + " done";
    }

    // 6. Add a new task
    function addTask() {
      const value = input.value.trim(); // trim() removes extra spaces
      if (value === "") return;         // ignore empty input

      tasks.push({ id: newId(), text: value, due: dueInput.value, done: false });
      input.value = "";
      dueInput.value = "";
      input.focus();
      save();
      render();
    }

    // 7. Listen for clicks and key presses
    addBtn.addEventListener("click", addTask);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") addTask();
    });

    // Filter buttons: remember which one was clicked, then redraw
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        editingId = null;
        render();
      });
    });

    // Sort toggle
    sortToggle.addEventListener("change", () => {
      sortByDue = sortToggle.checked;
      editingId = null;
      render();
    });

    // 8. Draw the list for the first time when the page loads
    render();
  </script>
</body>
</html>
